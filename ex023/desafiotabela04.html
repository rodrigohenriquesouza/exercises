<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>

     <style>

         body { 
            font-family: Arial, Helvetica, sans-serif;
         }

         table { 

            border-collapse: collapse;

         }

         th, td { 

            padding: 10px;
            font-weight: bold;
            border: 1px solid black;
         }

         thead { 

            background-color: gray;
            color: white;
         }

         .exatas { 

            text-align: left;
         }

     </style>

</head>
<body>
    <h1>Desafio Tabela</h1>
    
    <table>
        <thead>
            <th rowspan="2" scope="col">Área</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Média</th>
        <tr>
          <th>Nota 1</th>
          <th>Nota 2</th>
        </tr>
        </thead>
        <tbody>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>Matemática</td>
            <td>10</td>
            <td>10</td>
            <td>10</td>
        <tr>
            <td>Física</td>
            <td>8</td>
            <td>9</td>
            <td>8,5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>9</td>
                <td>9</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>5</td>
                <td>6</td>
                <td>5,5</td>
            </tr>
        </tbody>
        <thead>
            <th colspan="4" class="exatas" scope="row">Média de Exatas</th>
            <th>9,5</th>
        </thead>
        <tbody>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>8</td>
                <td>9</td>
                <td>8,5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>7</td>
                <td>6</td>
                <td>7,5</td>
            </tr>
        </tbody>
        <thead>
            <th colspan="4" class="exatas" scope="row">Média de Humanas</th>
            <th>7,5</th>
        </thead>
    </table>
</body>
</html>
