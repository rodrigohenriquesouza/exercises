<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>

        body { 
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 { 
            text-align: center;
        }

        table { 
            margin: auto;
            border-collapse: collapse;
        }

        td { 
            text-align: center;
            width: 60px;
            padding: 8px;
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td colspan="3">1</td>
        </tr>
        <tr>
            <td rowspan="2">4</td>
            <td rowspan="2">5</td>
            
        </tr>
        <tr>
            <td rowspan="2">6</td>
            
            
            
        </tr>
        <tr>
            <td colspan="3">10</td>
            
        </tr>
    </table>
    
</body>
</html>
