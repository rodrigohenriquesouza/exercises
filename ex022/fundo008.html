<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
</head>
<style>
    #container { 
        background-color: rgba(185, 14, 14, 0.733);
        background-image: url('imagens/target001.png');
        background-size: 100% 100%;
        position: relative;
        height: 700px;
     padding: 10px;
    }

    #conteudo { 
        background-color: aqua;
        background-image: url('imagens/target001.png');
        background-size: 100% 100%;
        position: absolute;
        top: 50%;
        left: 50%;
        height: 300px;
        width: 500px;
        transform: translate(-50%, -50%);

    }
</style>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
